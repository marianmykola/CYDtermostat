[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  nitek/XPT2046_Bitbang_Slim@^2.0.0
  bblanchon/ArduinoJson@^6.21.3
  milesburton/DallasTemperature @ ^3.11.0
  tzapu/WiFiManager@^2.0.16-rc.2
  knolleary/PubSubClient@^2.8
 

src_filter = +<*> -<.pio/libdeps/esp32/TFT_eSPI/examples>

build_flags =
  -DUSER_SETUP_LOADED=1           ; Рассказываем библиотеке, что настройки дисплея ниже
  -DST7789_DRIVER=1               ; Драйвер дисплея CYD
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DUSE_HSPI_PORT=1
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DSPI_TOUCH_FREQUENCY=2500000
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DTFT_INVERSION_OFF=1
  -DTFT_RGB_ORDER=TFT_BRG
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=0

board_build.filesystem = spiffs
board_build.flash_size = 4MB